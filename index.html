<title>Öğretmenler Günün Kutlu Olsun 🌹</title>

<style>
  :root {
    --pink: #ff6fa5;
    --pink-deep: #e0407f;
    --glass-bg: rgba(255, 255, 255, 0.16);
    --glass-border: rgba(255, 255, 255, 0.35);
  }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }

  /* Çiçekler mektup yırtılana kadar bekler */
  body.waiting .flowers { visibility: hidden; }
  body.waiting .flowers * { animation-play-state: paused !important; }

  /* Cam efektinin görünmesi için arkada yumuşak renkli lekeler */
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .6; animation: drift 14s ease-in-out infinite alternate; transition: opacity 1.5s ease; pointer-events: none; }
  .b1 { width: 45vmax; height: 45vmax; background: #ff4d79; top: -10vmax; left: -10vmax; }
  .b2 { width: 40vmax; height: 40vmax; background: #ffb86b; bottom: -12vmax; right: -8vmax; animation-delay: -5s; }
  .b3 { width: 30vmax; height: 30vmax; background: #8f5bff; top: 40%; left: 55%; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(6vmax, 5vmax) scale(1.15); } }
  body.revealed .blob { opacity: 0; }

  /* ---------- Zarf ---------- */
  .scene { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none; transition: opacity .5s ease, transform .5s ease; }
  .envelope {
    position: relative; display: block; width: min(88vw, 340px); aspect-ratio: 3 / 2; padding: 0; cursor: pointer; color: #fff; font: inherit; pointer-events: auto;
    border: 1px solid var(--glass-border); border-radius: 16px;
    background: rgba(120, 25, 75, 0.5); /* fallback */
    background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,.1));
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .envelope:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .envelope::before {
    content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    background:
      linear-gradient(to top right, transparent calc(50% - .5px), rgba(255,255,255,.3) 50%, transparent calc(50% + .5px)) left bottom / 50% 55% no-repeat,
      linear-gradient(to top left, transparent calc(50% - .5px), rgba(255,255,255,.3) 50%, transparent calc(50% + .5px)) right bottom / 50% 55% no-repeat;
  }
  .flap {
    position: absolute; top: 0; left: 0; width: 100%; height: 56%;
    background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,.18));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .6s ease;
    border-radius: 16px 16px 0 0;
  }
  .heart {
    position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
    width: 54px; height: 54px; display: grid; place-items: center; font-size: 28px; color: #fff;
    background: radial-gradient(circle at 30% 30%, #ff8fb8, var(--pink-deep));
    border: 1px solid rgba(255,255,255,.6); border-radius: 50%;
    box-shadow: 0 6px 18px rgba(224,64,127,.6);
    animation: beat 1.4s ease-in-out infinite; transition: opacity .3s;
  }
  @keyframes beat { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.15); } }
  .tap { position: absolute; left: 0; right: 0; top: 71%; text-align: center; font-size: .95rem; font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .from { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: .82rem; letter-spacing: .5px; opacity: .85; font-style: italic; }

  body.open .flap { transform: perspective(600px) rotateX(180deg); }
  body.open .heart { opacity: 0; }
  body.open .scene { opacity: 0; transform: translateY(30px) scale(.9); transition-delay: .55s; }
  body.open .envelope { pointer-events: none; }

  /* ---------- Mektup ---------- */
  .letter {
    position: fixed; z-index: 60; left: 50%; top: 50%;
    width: min(92vw, 520px); max-height: 90vh; overflow: auto;
    padding: 36px 28px 28px; text-align: center;
    background: rgba(100, 20, 65, 0.6); /* fallback */
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
    border: 1px solid var(--glass-border); border-radius: 26px;
    box-shadow: 0 24px 70px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.4);
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translate(-50%, -30%) scale(.55);
    transition: opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s .6s;
  }
  body.open .letter {
    opacity: 1; visibility: visible; pointer-events: auto;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity .5s ease .35s, transform .7s cubic-bezier(.2,.8,.2,1) .35s, visibility 0s;
  }
  .letter h1 { color: #ffc2dc; font-size: clamp(1.4rem, 5.5vw, 1.9rem); line-height: 1.3; text-shadow: 0 2px 10px rgba(120,0,60,.55); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px auto; max-width: 340px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--pink), transparent); }
  .divider span { font-size: 1.6rem; }
  .letter p { color: #fff; font-size: clamp(1rem, 3.8vw, 1.15rem); line-height: 1.7; text-shadow: 0 1px 8px rgba(80,0,40,.55); }
  .letter .thanks { margin-top: 14px; color: #ffc2dc; font-weight: 700; font-size: 1.2rem; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
  .btn {
    padding: 12px 22px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: rgba(255,255,255,.18); border: 1px solid var(--glass-border); border-radius: 999px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: transform .2s, background .2s;
  }
  .btn:hover { background: rgba(255,255,255,.32); transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn.primary { background: rgba(255,111,165,.55); }

  /* ---------- Yırtılma ---------- */
  #letter.hidden-orig { visibility: hidden; transition: none; }
  .letter.half { pointer-events: none; overflow: hidden; }
  .letter.half.l { clip-path: polygon(0 0, 50% 0, 53% 8%, 47% 16%, 53% 25%, 47% 34%, 53% 43%, 47% 52%, 53% 61%, 47% 70%, 53% 79%, 47% 88%, 53% 100%, 0 100%); }
  .letter.half.r { clip-path: polygon(50% 0, 53% 8%, 47% 16%, 53% 25%, 47% 34%, 53% 43%, 47% 52%, 53% 61%, 47% 70%, 53% 79%, 47% 88%, 53% 100%, 100% 100%, 100% 0); }
  body.open .letter.half { transition: transform 1s cubic-bezier(.5,0,.9,.6), opacity 1s ease-in; }
  body.open .letter.half.l.go { transform: translate(calc(-50% - 75vw), -42%) rotate(-16deg); opacity: 0; }
  body.open .letter.half.r.go { transform: translate(calc(-50% + 75vw), -42%) rotate(16deg); opacity: 0; }
  #letter.shake { animation: shake .35s linear; }
  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%); }
    20% { transform: translate(calc(-50% - 6px), -50%) rotate(-1deg); }
    40% { transform: translate(calc(-50% + 6px), -50%) rotate(1deg); }
    60% { transform: translate(calc(-50% - 5px), -50%) rotate(-.8deg); }
    80% { transform: translate(calc(-50% + 5px), -50%) rotate(.8deg); }
  }

  /* ---------- Güller ---------- */
  .petal { position: fixed; top: -40px; z-index: 300; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  @media (prefers-contrast: more) {
    .envelope, .letter { background: rgba(40, 5, 30, .94); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .envelope, .heart { animation: none; }
  }
</style>

      </div>
    </div>

    <div class="long-g long-g--5">
      <div class="grow-ans" style="--d:4s">
        <div class="leaf leaf--0"></div>
      </div>
      <div class="grow-ans" style="--d:4.2s">
        <div class="leaf leaf--1"></div>
      </div>
      <div class="grow-ans" style="--d:3s">
        <div class="leaf leaf--2"></div>
      </div>
      <div class="grow-ans" style="--d:3.6s">
        <div class="leaf leaf--3"></div>
      </div>
    </div>

    <div class="long-g long-g--6">
      <div class="grow-ans" style="--d:4.2s">
        <div class="leaf leaf--0"></div>
      </div>
      <div class="grow-ans" style="--d:4.4s">
        <div class="leaf leaf--1"></div>
      </div>
      <div class="grow-ans" style="--d:4.6s">
        <div class="leaf leaf--2"></div>
      </div>
      <div class="grow-ans" style="--d:4.8s">
        <div class="leaf leaf--3"></div>
      </div>
    </div>

    <div class="long-g long-g--7">
      <div class="grow-ans" style="--d:3s">
        <div class="leaf leaf--0"></div>
      </div>
      <div class="grow-ans" style="--d:3.2s">
        <div class="leaf leaf--1"></div>
      </div>
      <div class="grow-ans" style="--d:3.5s">
        <div class="leaf leaf--2"></div>

      <div class="grow-ans" style="--d:3.6s">
        <div class="leaf leaf--3"></div>

  <div class="scene">
    <button class="envelope" id="open" type="button" aria-label="Mektubu açmak için dokun">
      <div class="flap"></div>
      <div class="heart" aria-hidden="true">♥</div>
      <div class="tap">Açmak için dokun</div>
      <div class="from">Sevgiyle hazırlandı</div>
    </button>
  </div>

  <main class="letter" id="letter" role="dialog" aria-label="Mektup">
    <h1>Öğretmenler günün kutlu olsun, senin için en iyisini istiyorum 🌹</h1>
    <div class="divider" aria-hidden="true"><span>🌹</span></div>
    <p>Sabrın, emeğin, güler yüzün ve öğrencilerine katacağın her güzel değerle harika bir öğretmen olacaksın. Hayallerin gerçeğe dönüştüğü, başarılarla dolu en güzel yarınlar seninle olsun.</p>
    <p class="thanks">İyi ki varsın 💗</p>
    <div class="actions">
      <button class="btn primary" id="surprise" type="button">Sürprizi Gör ✨</button>
      <button class="btn" id="rain" type="button" aria-pressed="false">Gül Yağmuru Başlat 🌹</button>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function petal() {
    const el = document.createElement("span");
    el.className = "petal";
    el.textContent = Math.random() < .75 ? "🌹" : "🌸";
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = 16 + Math.random() * 22 + "px";
    el.style.animationDuration = 4 + Math.random() * 4 + "s";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }

  // arkada hep yavaş yavaş akan güller
  if (!reduce) setInterval(petal, 700);

  // butonla yoğun yağmur
  let timer = null;
  function setRain(on) {
    clearInterval(timer);
    timer = on ? setInterval(petal, 120) : null;
    if (on) for (let i = 0; i < 25; i++) setTimeout(petal, i * 40);
    const b = $("rain");
    b.textContent = on ? "Yağmuru Azalt 🌹" : "Gül Yağmuru Başlat 🌹";
    b.setAttribute("aria-pressed", String(on));
  }
  $("rain").addEventListener("click", () => setRain(!timer));

  $("open").addEventListener("click", () => {
    document.body.classList.add("open");
    $("surprise").focus({ preventScroll: true });
  });

  // mektubu ikiye yırt, çiçekleri başlat
  let torn = false;
  $("surprise").addEventListener("click", () => {
    if (torn) return;
    torn = true;
    setRain(false);
    const letter = $("letter");
    letter.classList.add("shake");

    setTimeout(() => {
      const halves = ["l", "r"].map((side) => {
        const h = letter.cloneNode(true);
        h.removeAttribute("id");
        h.removeAttribute("role");
        h.setAttribute("aria-hidden", "true");
        h.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
        h.querySelectorAll("button").forEach((n) => (n.tabIndex = -1));
        h.classList.remove("shake");
        h.classList.add("half", side);
        document.body.appendChild(h);
        return h;
      });
      letter.classList.remove("shake");
      letter.classList.add("hidden-orig");

      requestAnimationFrame(() => requestAnimationFrame(() => {
        halves.forEach((h) => h.classList.add("go"));
        document.body.classList.add("revealed");
        document.body.classList.remove("waiting");
      }));
      setTimeout(() => halves.forEach((h) => h.remove()), 1200);
    }, 350);
  });
</script>
</body>
</html>
